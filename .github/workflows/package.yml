name: Package extension

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: meta
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::Tag v$TAG != manifest version ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p dist
          ZIP="dist/chrome-faster-top-bookmark-v${{ steps.meta.outputs.version }}.zip"
          zip -X "$ZIP" manifest.json init.js background.html selectCategory1.js fuse.js style.css action.png bookmark.png search.png LICENSE
          unzip -l "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-faster-top-bookmark-v${{ steps.meta.outputs.version }}
          path: dist/*.zip

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
